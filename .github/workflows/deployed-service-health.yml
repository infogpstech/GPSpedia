name: GPSpedia deployed service health (read-only)
on:
  push:
    branches:
      - GPSpedia2.2.5_work
    paths:
      - ".github/workflows/deployed-service-health.yml"
      - "JS/Tests/RemoteServiceHealth.mjs"
      - "JS/Tests/ServiceHealthContract.mjs"
      - "JS/Frontend/api-config.js"
      - "Services/SERVICE_HEALTH.md"
      - "JS/Services/Auth.js"
      - "JS/Services/catalog.js"
      - "JS/Services/write.js"
      - "JS/Services/feedback.js"
      - "JS/Services/Utilities.js"
      - "JS/Services/admin.js"
      - "JS/Tests/RemoteCatalogFeedReadOnly.mjs"
      - "JS/Tests/RemoteCatalogFeedBoundaries.mjs"
      - "JS/Tests/RemoteAdminLatency.mjs"
      - "JS/Tests/RemoteCatalogFeedMatrix.mjs"
      - "JS/Tests/RemoteCatalogFeedPagination.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpsepedia-deployed-health
  cancel-in-progress: false
jobs:
  deployed-service-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GPSPEDIA_HEALTH_ENV: BETA_ISOLATED
      GPSPEDIA_CONFIRM_BETA_ENDPOINTS: I_HAVE_VERIFIED_THE_SIX_ENDPOINTS_ARE_BETA
      TARGET_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: GPSpedia2.2.5_work
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch exact source from this workflow run
        run: |
          git fetch --no-tags --depth=1 origin "$TARGET_COMMIT"
          git cat-file -e "$TARGET_COMMIT^{commit}"
          test "$(git show "$TARGET_COMMIT:JS/Frontend/api-config.js" | grep -c 'GPSpedia-')" -eq 6
      - name: Validate local service health contracts
        id: local_contract
        run: node --experimental-default-type=module JS/Tests/ServiceHealthContract.mjs
      - name: Probe all six deployed services (GET only)
        id: health
        if: always()
        run: node JS/Tests/RemoteServiceHealth.mjs
      - name: Probe CATALOG feed cursors (GET only)
        id: catalog_feed
        if: always()
        run: node JS/Tests/RemoteCatalogFeedReadOnly.mjs
      - name: Probe CATALOG feed cursor boundaries (GET only)
        id: catalog_boundaries
        if: always()
        run: node JS/Tests/RemoteCatalogFeedBoundaries.mjs
      - name: Measure ADMIN latency repeatedly (GET only)
        id: admin_latency
        if: always()
        run: node JS/Tests/RemoteAdminLatency.mjs
      - name: Measure UTILITIES latency repeatedly (GET only)
        id: utilities_latency
        if: always()
        env:
          SERVICE_KEY: UTILITIES
        run: node JS/Tests/RemoteAdminLatency.mjs
      - name: Probe CATALOG feed matrix and repeatability (GET only)
        id: catalog_matrix
        if: always()
        run: node JS/Tests/RemoteCatalogFeedMatrix.mjs

      - name: Verify CATALOG feed page-by-page cursor progression (GET only)
        id: catalog_pagination
        if: always()
        run: node JS/Tests/RemoteCatalogFeedPagination.mjs

      - name: Summarize independent read-only probe outcomes
        if: always()
        env:
          CONTRACT_OUTCOME: ${{ steps.local_contract.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          FEED_OUTCOME: ${{ steps.catalog_feed.outcome }}
          BOUNDARIES_OUTCOME: ${{ steps.catalog_boundaries.outcome }}
          ADMIN_LATENCY_OUTCOME: ${{ steps.admin_latency.outcome }}
          UTILITIES_LATENCY_OUTCOME: ${{ steps.utilities_latency.outcome }}
          MATRIX_OUTCOME: ${{ steps.catalog_matrix.outcome }}
          PAGINATION_OUTCOME: ${{ steps.catalog_pagination.outcome }}
        run: |
          printf '%s\n' \
            "Local contract: $CONTRACT_OUTCOME" \
            "Health: $HEALTH_OUTCOME" \
            "Feed: $FEED_OUTCOME" \
            "Boundaries: $BOUNDARIES_OUTCOME" \
            "ADMIN latency: $ADMIN_LATENCY_OUTCOME" \
            "UTILITIES latency: $UTILITIES_LATENCY_OUTCOME" \
            "CATALOG matrix: $MATRIX_OUTCOME" \
            "CATALOG pagination: $PAGINATION_OUTCOME"
          if [ "$CONTRACT_OUTCOME" = success ] &&
             [ "$HEALTH_OUTCOME" = success ] &&
             [ "$FEED_OUTCOME" = success ] &&
             [ "$BOUNDARIES_OUTCOME" = success ] &&
             [ "$ADMIN_LATENCY_OUTCOME" = success ] &&
             [ "$UTILITIES_LATENCY_OUTCOME" = success ] &&
             [ "$MATRIX_OUTCOME" = success ] &&
             [ "$PAGINATION_OUTCOME" = success ]; then
            exit 0
          fi
          exit 1
