name: GPSpedia deployed service health (read-only)
on:
  push:
    branches:
      - health-probe-20261117
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpsepedia-deployed-health
  cancel-in-progress: false
jobs:
  deployed-service-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_COMMIT: 301c7b3a5840549819b2b6126d548df44af07da2
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: health-probe-20261117
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch exact historical source under test
        run: |
          git fetch --no-tags --depth=1 origin "$TARGET_COMMIT"
          git cat-file -e "$TARGET_COMMIT^{commit}"
          test "$(git show "$TARGET_COMMIT:JS/Frontend/api-config.js" | grep -c 'GPSpedia-')" -eq 7
      - name: Probe all seven deployed services (GET only)
        run: node JS/Tests/RemoteServiceHealth.mjs
