name: GPSpedia service regression tests
on:
  push:
    branches:
      - GPSpedia2.2.5_work
  pull_request:
    branches:
      - GPSpedia2.2.5_work
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: GPSpedia2.2.5_work
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify branch and repository
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_URL="$(git remote get-url origin)"
          case "$REMOTE_URL" in
            https://github.com/infogpstech/GPSpedia|https://github.com/infogpstech/GPSpedia.git|git@github.com:infogpstech/GPSpedia|git@github.com:infogpstech/GPSpedia.git) ;;
            *) echo "Repositorio remoto incorrecto"; exit 1 ;;
          esac
          test "$(git branch --show-current)" = "GPSpedia2.2.5_work"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
      - name: Check syntax of modified JavaScript modules
        run: |
          node --experimental-default-type=module --check JS/Frontend/api-config.js
          node --check JS/Frontend/main.js
          node --check JS/Frontend/auth.js
          node --check JS/Frontend/ui.js
          node --check JS/Frontend/offline.js
          node --check JS/Frontend/clientInteractionPolicy.js
          node --check service-worker.js
          node --check JS/Services/Auth.js
          node --check JS/Services/InboxConversations.js
          node --check JS/Services/SharedSessionActor.js
          node --check JS/Services/Utilities.js
          node --check JS/Services/admin.js
          node --check JS/Services/catalog.js
          node --check JS/Services/feedback.js
          node --check JS/Tests/UsersAtomicMutations.js
          node --check JS/Services/write.js
      - name: Run isolated service regression suites
        run: node --experimental-default-type=module JS/Tests/RunServiceTests.mjs

  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authorized working branch
        uses: actions/checkout@v4
        with:
          ref: GPSpedia2.2.5_work
          fetch-depth: 1
      - name: Verify repository and branch
        shell: bash
        run: |
          set -euo pipefail
          case "$(git remote get-url origin)" in
            https://github.com/infogpstech/GPSpedia|https://github.com/infogpstech/GPSpedia.git) ;;
            *) echo "Repositorio remoto incorrecto"; exit 1 ;;
          esac
          test "$(git branch --show-current)" = "GPSpedia2.2.5_work"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run AUG-146 real-browser checks at all required viewports
        run: |
          mkdir -p artifacts
          node JS/Tests/Aug146ResponsiveBrowser.mjs
      - name: Smoke test deployed Beta Pages login surface (GET-only)
        run: node JS/Tests/BetaDeployedPageSmoke.mjs
        env:
          BETA_PAGES_URL: https://infogpstech.github.io/GPSpedia/

      - name: Validate deployed Beta PWA manifest and offline navigation (GET only)
        run: node JS/Tests/BetaPwaOfflineSmoke.mjs
        env:
          BETA_PAGES_URL: https://infogpstech.github.io/GPSpedia/
      - name: Upload anonymized synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aug-146-responsive-browser-evidence
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
