name: GPSpedia AUG-146 real-browser responsive validation
on:
  push:
    branches:
      - GPSpedia2.2.5_work
    paths:
      - "index.html"
      - "style.css"
      - "contextual-help.css"
      - "button-system.css"
      - "JS/Frontend/**"
      - "JS/Tests/Aug146ResponsiveBrowser.mjs"
      - ".github/workflows/aug-146-browser.yml"
  pull_request:
    branches:
      - GPSpedia2.2.5_work
    paths:
      - "index.html"
      - "style.css"
      - "contextual-help.css"
      - "button-system.css"
      - "JS/Frontend/**"
      - "JS/Tests/Aug146ResponsiveBrowser.mjs"
      - ".github/workflows/aug-146-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpsepedia-aug-146-browser
  cancel-in-progress: false
jobs:
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authorized working branch
        uses: actions/checkout@v4
        with:
          ref: GPSpedia2.2.5_work
          fetch-depth: 1
      - name: Verify repository and branch
        shell: bash
        run: |
          set -euo pipefail
          case "$(git remote get-url origin)" in
            https://github.com/infogpstech/GPSpedia|https://github.com/infogpstech/GPSpedia.git) ;;
            *) echo "Repositorio remoto incorrecto"; exit 1 ;;
          esac
          test "$(git branch --show-current)" = "GPSpedia2.2.5_work"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run AUG-146 real-browser checks at all required viewports
        run: |
          mkdir -p artifacts
          node JS/Tests/Aug146ResponsiveBrowser.mjs
      - name: Upload anonymized synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aug-146-responsive-browser-evidence
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
