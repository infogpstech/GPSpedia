name: GPSpedia FileReader real-browser check
on:
  push:
    branches:
      - GPSpedia2.2.5_work
    paths:
      - "HTML/add_cortes.html"
      - "JS/Tests/FileReaderBrowserRuntime.mjs"
      - "JS/Tests/FileReaderBrowserHarness.html"
      - ".github/workflows/file-reader-browser.yml"
  pull_request:
    branches:
      - GPSpedia2.2.5_work
    paths:
      - "HTML/add_cortes.html"
      - "JS/Tests/FileReaderBrowserRuntime.mjs"
      - "JS/Tests/FileReaderBrowserHarness.html"
      - ".github/workflows/file-reader-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-reader-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: GPSpedia2.2.5_work
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production FileReader helper in browser engines
        run: node JS/Tests/FileReaderBrowserRuntime.mjs
